{{- if .Values.pranaBindu.backup.enabled }}
{{- if not .Values.pranaBindu.persistence.enabled }}
{{- fail "pranaBindu.backup.enabled requires pranaBindu.persistence.enabled: the backup job reads the database from the PersistentVolumeClaim" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.pranaBindu.backup.schedule | quote }}
  {{- if .Values.pranaBindu.backup.timeZone }}
  timeZone: {{ .Values.pranaBindu.backup.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  # Still run a backup missed while the cluster was down, if it comes back within an hour.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: {{ .Values.pranaBindu.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.pranaBindu.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          imagePullSecrets: {{ toJson .Values.pranaBindu.imagePullSecrets }}
          securityContext: {{ toJson .Values.pranaBindu.podSecurityContext }}
          containers:
            - name: backup
              image: {{ .Values.pranaBindu.image | quote }}
              imagePullPolicy: {{ .Values.pranaBindu.imagePullPolicy | quote }}
              args: ["backup"]
              {{- if gt (len .Values.pranaBindu.config) 0 }}
              env:
                {{- range $configKey, $configValue := .Values.pranaBindu.config }}
                - name: {{ $configKey }}
                  value: {{ $configValue | quote }}
                {{- end }}
              {{- end }}
              {{- if gt (len .Values.pranaBindu.secretConfig) 0 }}
              envFrom:
                - secretRef:
                    name: {{ .Release.Name }}-secret
              {{- end }}
              securityContext: {{ toJson .Values.pranaBindu.securityContext }}
              resources: {{ toJson .Values.pranaBindu.backup.resources }}
              # Writable even though the job only reads: SQLite readers of a WAL database take locks in prana.db-shm.
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-pvc
          # A ReadWriteOnce volume can only be mounted on one node, so run next to the application pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: {{ .Chart.Name }}
                      app.kubernetes.io/instance: {{ .Release.Name }}
                  topologyKey: kubernetes.io/hostname
          nodeSelector: {{ toJson .Values.pranaBindu.nodeSelector }}
          tolerations: {{ toJson .Values.pranaBindu.tolerations }}
{{- end }}
